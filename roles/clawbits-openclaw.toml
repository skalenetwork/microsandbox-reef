version = 1

name  = "clawbits-openclaw"
image = "ghcr.io/skalenetwork/clawbits-openclaw@sha256:1d44c0f0786666cf212042002c0099cb087172538f5ab72f172f8156ac8d05b9"
init  = ["/usr/bin/tini", "-s", "--", "/etc/openclaw/start"]

[resources]
vcpus = 4
memory-mib = 6144
disk-gib = 20

[env]
HOME = "/home/node"
XDG_CACHE_HOME = "/home/node/.openclaw/cache"
OPENCLAW_SUPERVISOR_MODE = "external"
OPENCLAW_NO_AUTO_UPDATE = "1"

[files]
"/etc/openclaw/start" = { mode = 0o755, content = '''
#!/bin/sh
set -e
cfg=/home/node/.openclaw/openclaw.json
[ -e "$cfg" ] || install -o node -g node -m 0600 /etc/openclaw/defaults.json "$cfg"
exec /usr/sbin/runuser -u node -- /usr/local/bin/node /app/openclaw.mjs gateway \
  --bind lan --auth token
''' }
"/etc/openclaw/defaults.json" = '''
{
  "gateway": {
    "mode": "local",
    "controlUi": {
      "allowedOrigins": [
        "http://${REEF_AGENT}.localhost:${REEF_PORT_GATEWAY}",
        "http://127.0.0.1:${REEF_PORT_GATEWAY}"
      ]
    }
  },
  "tools": {
    "sessions": { "visibility": "agent" },
    "alsoAllow": [
      "browser",
      "clawbits_channels_list",
      "clawbits_channel_members",
      "clawbits_email_inbox",
      "clawbits_email_get",
      "clawbits_agent_info",
      "clawbits_email_send",
      "clawbits_agent_description_update"
    ]
  },
  "plugins": {
    "entries": {
      "clawbits": { "enabled": true, "hooks": { "allowConversationAccess": true } },
      "clawbits-tools": { "enabled": true, "hooks": { "allowConversationAccess": true } }
    }
  },
  "channels": {
    "clawbits": {
      "serviceOwner": "tools",
      "accounts": {
        "default": {
          "endpoint": "https://app.clawbits.ai",
          "orgId": "${CLAWBITS_ORG_ID}",
          "agentId": "${CLAWBITS_AGENT_ID}",
          "apiKey": "${CLAWBITS_API_KEY}",
          "channelId": "${CLAWBITS_CHANNEL_ID}"
        }
      }
    }
  }
}
'''

[expose]
gateway = 18789

[volumes]
state = { dest = "/home/node/.openclaw/state", size-mib = 4096 }
workspace = { dest = "/home/node/.openclaw/workspace", size-mib = 10240 }

[network]
egress = ["*"]
