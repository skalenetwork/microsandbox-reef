version = 1

name  = "openclaw-coding"
image = "ghcr.io/openclaw/openclaw@sha256:7be09e8c5f5370c5b0ab2f68df243ae0db57646ee1208ba1b264527d12946a01"
init  = ["/usr/bin/tini", "-s", "--", "/etc/openclaw/start"]

[resources]
vcpus = 4
memory-mib = 6144
disk-gib = 20

[env]
HOME = "/home/node"
XDG_CACHE_HOME = "/home/node/.openclaw/cache"
OPENCLAW_SUPERVISOR_MODE = "external"
OPENCLAW_NO_AUTO_UPDATE = "1"

[files]
"/etc/openclaw/start" = { mode = 0o755, content = '''
#!/bin/sh
set -e
cfg=/home/node/.openclaw/openclaw.json
[ -e "$cfg" ] || install -o node -g node -m 0600 /etc/openclaw/defaults.json "$cfg"
exec /usr/sbin/runuser -u node -- /usr/local/bin/node /app/openclaw.mjs gateway \
  --bind lan
''' }
"/etc/openclaw/defaults.json" = '''
{
  "agents": { "defaults": { "model": { "primary": "openrouter/auto" } } },
  "browser": { "extraArgs": ["--ignore-certificate-errors"] },
  "gateway": {
    "mode": "local",
    "trustedProxies": ["172.16.0.0/12"],
    "auth": {
      "mode": "trusted-proxy",
      "trustedProxy": {
        "userHeader": "cf-access-authenticated-user-email",
        "requiredHeaders": ["cf-access-jwt-assertion"],
        "deviceAutoApprove": {
          "enabled": true,
          "scopes": ["operator.read", "operator.write", "operator.approvals", "operator.questions"]
        }
      }
    },
    "controlUi": { "allowedOrigins": ["https://coding.agents.example.com"] }
  }
}
'''

[expose]
gateway = 18789

[volumes]
state = { dest = "/home/node/.openclaw", size-mib = 10240 }

[network]
egress = ["openrouter.ai", "github.com", "*.githubusercontent.com", "registry.npmjs.org"]

[secrets]
OPENROUTER_API_KEY = { ref = "reef://openclaw-coding/openrouter", host = "openrouter.ai" }
