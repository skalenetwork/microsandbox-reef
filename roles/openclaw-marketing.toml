version = 1

name  = "openclaw-marketing"
image = "ghcr.io/openclaw/openclaw@sha256:6d5fecea52bd1b42205238f2405d2e6ec4d03ca00254773b2c82e7517c7821de"
init  = ["/usr/bin/tini", "-s", "--", "/etc/openclaw/start"]

[resources]
vcpus = 4
memory-mib = 8192
disk-gib = 20

[env]
HOME = "/home/node"
XDG_CACHE_HOME = "/home/node/.openclaw/cache"
OPENCLAW_SUPERVISOR_MODE = "external"
OPENCLAW_NO_AUTO_UPDATE = "1"
NODE_EXTRA_CA_CERTS = "/.msb/tls/ca.pem"

[files]
"/etc/openclaw/start" = { mode = 0o755, content = '''
#!/bin/sh
set -e
cfg=/home/node/.openclaw/openclaw.json
[ -e "$cfg" ] || install -o node -g node -m 0600 /etc/openclaw/defaults.json "$cfg"
if [ -n "$OPENCLAW_SANDBOX_HOST" ]; then
  /usr/sbin/runuser -u node -- /usr/local/bin/node /app/openclaw.mjs config set \
    mcp.apps.sandboxOrigin "https://$OPENCLAW_SANDBOX_HOST"
fi
exec /usr/sbin/runuser -u node -- /usr/local/bin/node /app/openclaw.mjs gateway \
  --bind lan
''' }
"/etc/openclaw/defaults.json" = '''
{
  "agents": { "defaults": { "model": { "primary": "openrouter/auto" } } },
  "browser": { "extraArgs": ["--ignore-certificate-errors"] },
  "gateway": {
    "mode": "local",
    "trustedProxies": ["172.16.0.0/12"],
    "auth": {
      "mode": "trusted-proxy",
      "trustedProxy": {
        "userHeader": "cf-access-authenticated-user-email",
        "deviceAutoApprove": {
          "enabled": true,
          "scopes": ["operator.read", "operator.write", "operator.approvals", "operator.questions"]
        }
      }
    },
    "controlUi": { "allowedOrigins": ["https://${OPENCLAW_PUBLIC_HOST}"] }
  },
  "tools": {
    "sessions": { "visibility": "agent" },
    "web": { "search": { "enabled": false } }
  }
}
'''

[expose]
gateway = 18789
mcp-sandbox = 18790

[volumes]
state = { dest = "/home/node/.openclaw", size-mib = 10240 }

[network]
egress = [
  "openrouter.ai",
  "*.hubspot.com",
  "*.hsforms.net",
  "*.hsappstatic.net",
  "*.linkedin.com",
  "*.licdn.com",
]

[secrets]
OPENROUTER_API_KEY = { ref = "reef://openclaw-marketing/openrouter", host = "openrouter.ai" }
