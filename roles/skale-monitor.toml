version = 1

# Fork of roles/clawbits-openclaw.toml, re-derived 2026-09-08 from the current
# upstream file. Three changes:
#   - name, so both can live in reef.db side by side
#   - resources: 2 vCPU / 3072 MiB instead of 4 / 6144. Measured on this host:
#     the cap is a ceiling, not a reservation (905 MiB actually resident), and
#     2 vCPU is what every agent here has run on. 2048 MiB is NOT enough -
#     OpenClaw's pressure threshold is ~27% of guest RAM and the guest hangs.
#   - agents.defaults.model.primary, pinned to deepseek instead of
#     openrouter/auto. Verified: the start script re-applies defaults.json
#     through `config patch` on every boot, so a model set by hand is gone after
#     the next restart - it has to be changed here.
# Upstream moves fast (the start script and most of defaults.json migrated into
# the image on 2026-09-08); diff against the original before reusing this.
name  = "skale-monitor"
image = "ghcr.io/skalenetwork/clawbits-openclaw:oc2026.9.3-pl0.17.21"
init  = ["/usr/bin/tini", "-s", "--", "/usr/local/bin/clawbits-start"]

[resources]
vcpus = 2
memory-mib = 3072
disk-gib = 20

[env]
HOME = "/home/node"
XDG_CACHE_HOME = "/home/node/.openclaw/cache"
OPENCLAW_NO_AUTO_UPDATE = "1"
NODE_EXTRA_CA_CERTS = "/.msb/tls/ca.pem"
CLAWBITS_ENDPOINT = "https://app.clawbits.ai"

[files]
"/etc/openclaw/defaults.json" = '''
{
  "agents": { "defaults": { "model": { "primary": "openrouter/deepseek/deepseek-v4-pro-0813" } } },
  "browser": { "extraArgs": ["--ignore-certificate-errors"] },
  "gateway": {
    "controlUi": {
      "allowedOrigins": [
        "http://${REEF_AGENT}.localhost:${REEF_PORT_GATEWAY}",
        "http://127.0.0.1:${REEF_PORT_GATEWAY}"
      ]
    }
  },
  "tools": {
    "sessions": { "visibility": "agent" }
  }
}
'''

[expose]
gateway = 18789

[volumes]
state = { dest = "/home/node/.openclaw/state", size-mib = 4096 }
workspace = { dest = "/home/node/.openclaw/workspace", size-mib = 10240 }

[network]
egress = ["*"]

[secrets]
OPENROUTER_API_KEY = { ref = "reef://clawbits-openclaw/openrouter", host = "openrouter.ai" }
