version = 1

# Fork of roles/clawbits-openclaw.toml, regenerated from it. Three changes only:
#   - name, so both can live in reef.db side by side
#   - resources: 2 vCPU / 3072 MiB instead of 4 / 6144. Measured here: the cap
#     is a ceiling, not a reservation (905 MiB actually resident), and 2 vCPU is
#     what every agent on this host has run on. 2048 MiB is NOT enough -
#     OpenClaw's pressure threshold is ~27% of guest RAM and the guest hangs.
#   - agents.defaults.model.primary, pinned to deepseek instead of
#     openrouter/auto. Verified: the start script re-applies defaults.json
#     through `config patch` on every boot, so a model set by hand is gone after
#     the next restart - it has to be changed here.
#
# Upstream changes often and structurally (the start script has moved into the
# image and back out again, and an mcp-sandbox port appeared). Regenerate rather
# than hand-edit - see the command in .claude/handoff-clawbits-msb.md.
name  = "skale-monitor"
image = "ghcr.io/skalenetwork/clawbits-openclaw:oc2026.9.3-pl0.17.24-ge5abfaa"
init  = ["/usr/bin/tini", "-s", "--", "/etc/openclaw/start"]

[resources]
vcpus = 2
memory-mib = 3072
disk-gib = 20

[env]
HOME = "/home/node"
XDG_CACHE_HOME = "/home/node/.openclaw/cache"
OPENCLAW_NO_AUTO_UPDATE = "1"
NODE_EXTRA_CA_CERTS = "/.msb/tls/ca.pem"
CLAWBITS_ENDPOINT = "https://app.clawbits.ai"

[files]
"/etc/openclaw/start" = { mode = 0o755, content = '''
#!/bin/sh
set -e
if [ "$(id -u)" = 0 ]; then
  install -d -o node -g node /home/node/.openclaw
  oc() { /usr/sbin/runuser -u node -- /usr/local/bin/node /app/openclaw.mjs "$@"; }
else
  oc() { /usr/local/bin/node /app/openclaw.mjs "$@"; }
fi
oc config set mcp.apps.sandboxOrigin \
  "http://$REEF_AGENT.localhost:$REEF_PORT_MCP_SANDBOX"
exec /usr/local/bin/clawbits-start
''' }
"/etc/openclaw/defaults.json" = '''
{
  "agents": { "defaults": { "model": { "primary": "openrouter/deepseek/deepseek-v4-pro-0813" } } },
  "browser": { "extraArgs": ["--ignore-certificate-errors"] },
  "gateway": {
    "controlUi": {
      "allowedOrigins": [
        "http://${REEF_AGENT}.localhost:${REEF_PORT_GATEWAY}",
        "http://127.0.0.1:${REEF_PORT_GATEWAY}"
      ]
    }
  },
  "tools": {
    "sessions": { "visibility": "agent" }
  }
}
'''

[expose]
gateway = 18789
mcp-sandbox = 18790

[volumes]
state = { dest = "/home/node/.openclaw/state", size-mib = 4096 }
workspace = { dest = "/home/node/.openclaw/workspace", size-mib = 10240 }

[network]
egress = ["*"]

[secrets]
OPENROUTER_API_KEY = { ref = "reef://clawbits-openclaw/openrouter", host = "openrouter.ai" }
