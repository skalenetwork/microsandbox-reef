version = 1

# Fork of the canonical clawbits-openclaw role. Three changes:
#   - name, so both can live in reef.db side by side
#   - resources: 2 vCPU / 3072 MiB instead of 4 / 6144 (the cap is a ceiling,
#     not a reservation; 2048 MiB hangs the guest)
#   - model pinned to deepseek: defaults.json is re-applied on every boot, so
#     setting it by hand does not survive a restart
#
# The canonical role now lives in the PRIVATE repo skalenetwork/clawbits-reef-store
# (roles/clawbits-openclaw.toml), no longer in microsandbox-reef - the copy in
# .claude/clawbits-openclaw-upstream.toml is the last one seen, 2026-09-22.
# Regenerate from it; never hand-edit. Blocks have appeared there that a hand
# edit would have missed: the `agents` volume for chat sessions, the premigrate
# restore, and the guard that deletes a zero-byte openclaw.json (without it an
# interrupted boot wedges the agent permanently while the VM reports healthy).
name  = "skale-monitor"
image = "ghcr.io/skalenetwork/clawbits-openclaw:oc2026.9.5-pl0.18.0-g9bea604"
init  = ["/usr/bin/tini", "-s", "--", "/etc/openclaw/start"]

[resources]
vcpus = 2
memory-mib = 3072
disk-gib = 20

[env]
HOME = "/home/node"
XDG_CACHE_HOME = "/home/node/.openclaw/cache"
OPENCLAW_NO_AUTO_UPDATE = "1"
NODE_EXTRA_CA_CERTS = "/.msb/tls/ca.pem"
CLAWBITS_ENDPOINT = "https://app.clawbits.ai"

[files]
"/etc/openclaw/start" = { mode = 0o755, content = '''
#!/bin/sh
set -e
if [ "$(id -u)" = 0 ]; then
  install -d -o node -g node /home/node/.openclaw
  oc() { /usr/sbin/runuser -u node -- /usr/local/bin/node /app/openclaw.mjs "$@"; }
else
  oc() { /usr/local/bin/node /app/openclaw.mjs "$@"; }
fi
if [ -d /home/node/.openclaw/state/premigrate ]; then
  cp -a /home/node/.openclaw/state/premigrate/. /home/node/.openclaw/
  rm -rf /home/node/.openclaw/state/premigrate
fi
# A boot interrupted while the engine was writing this file leaves it empty, and
# every `oc` call then refuses to run ("OpenClaw config is invalid"), starting
# with the one below — so the agent never recovers on its own, boot after boot,
# while the VM still reports healthy. The image ships without a config, so
# removing a zero-byte one is exactly the state a first boot expects.
cfg=/home/node/.openclaw/openclaw.json
[ ! -e "$cfg" ] || [ -s "$cfg" ] || rm -f "$cfg"
oc config set mcp.apps.sandboxOrigin \
  "http://$REEF_AGENT.localhost:$REEF_PORT_MCP_SANDBOX"
exec /usr/local/bin/clawbits-start
''' }
"/etc/openclaw/defaults.json" = '''
{
  "agents": { "defaults": { "model": { "primary": "openrouter/deepseek/deepseek-v4-pro-0813" } } },
  "browser": { "extraArgs": ["--ignore-certificate-errors"] },
  "gateway": {
    "controlUi": {
      "allowedOrigins": [
        "http://${REEF_AGENT}.localhost:${REEF_PORT_GATEWAY}",
        "http://127.0.0.1:${REEF_PORT_GATEWAY}"
      ]
    }
  },
  "tools": {
    "sessions": { "visibility": "agent" }
  }
}
'''

[expose]
gateway = 18789
mcp-sandbox = 18790

[volumes]
agents = { dest = "/home/node/.openclaw/agents", size-mib = 4096 }
state = { dest = "/home/node/.openclaw/state", size-mib = 4096 }
workspace = { dest = "/home/node/.openclaw/workspace", size-mib = 10240 }

[network]
egress = ["*"]

[secrets]
OPENROUTER_API_KEY = { ref = "reef://clawbits-openclaw/openrouter", host = "openrouter.ai" }
