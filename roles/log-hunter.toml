version = 1

# Fork of the canonical clawbits-openclaw role. Three changes:
#   - name, so both can live in reef.db side by side
#   - resources: 2 vCPU / 3072 MiB instead of 4 / 6144 (the cap is a ceiling,
#     not a reservation; 2048 MiB hangs the guest)
#   - model pinned to qwen3.8-flash with deepseek-v4-pro-0813 as fallback:
#     defaults.json is re-applied on every boot, so setting it by hand does not
#     survive a restart. The Clawbits model switcher picks any OpenRouter model
#     per chat and overrides the pin; the pin is what cron and monitoring-trigger
#     sessions run on. The fallback exists because OpenRouter serves qwen3.8-flash
#     from a single provider (Alibaba), which rate-limited a run for forty minutes
#     on 2026-09-25; the gateway switches models on rate_limited/overloaded/
#     timeout/billing, so a run finishes on deepseek rather than dying.
#
# The canonical role is skalenetwork/clawbits-reef-store roles/clawbits-openclaw.toml;
# since 2026-09-25 it is mirrored into this repo's roles/clawbits-openclaw.toml
# (pushed by Dima), which is what this fork is regenerated from. The copy in
# .claude/clawbits-openclaw-upstream.toml is a snapshot of that file at the last
# regeneration. Never hand-edit blocks that come from the canon: since pl0.20.0
# the image boots straight into /usr/local/bin/clawbits-start and the old
# /etc/openclaw/start wrapper (premigrate restore, zero-byte openclaw.json guard,
# mcp.apps.sandboxOrigin) lives inside the image.
name  = "log-hunter"
image = "ghcr.io/skalenetwork/clawbits-openclaw:oc2026.9.6-pl0.20.0-g333f708"
init  = ["/usr/bin/tini", "-s", "--", "/usr/local/bin/clawbits-start"]

[resources]
vcpus = 2
memory-mib = 3072
disk-gib = 20

[env]
HOME = "/home/node"
XDG_CACHE_HOME = "/home/node/.openclaw/cache"
OPENCLAW_NO_AUTO_UPDATE = "1"
NODE_EXTRA_CA_CERTS = "/.msb/tls/ca.pem"
CLAWBITS_ENDPOINT = "https://app.clawbits.ai"

[files]
"/etc/openclaw/defaults.json" = '''
{
  "agents": { "defaults": {
    "model": {
      "primary":   "openrouter/qwen/qwen3.8-flash",
      "fallbacks": ["openrouter/deepseek/deepseek-v4-pro-0813"]
    },
    "heartbeat": { "target": "none" }
  } },
  "browser": { "extraArgs": ["--ignore-certificate-errors"] },
  "gateway": {
    "controlUi": {
      "allowedOrigins": [
        "http://${REEF_AGENT}.localhost:${REEF_PORT_GATEWAY}",
        "http://127.0.0.1:${REEF_PORT_GATEWAY}"
      ]
    }
  },
  "tools": {
    "sessions": { "visibility": "agent" }
  }
}
'''

[expose]
gateway = 18789
mcp-sandbox = 18790

[volumes]
agents = { dest = "/home/node/.openclaw/agents", size-mib = 4096 }
state = { dest = "/home/node/.openclaw/state", size-mib = 4096 }
workspace = { dest = "/home/node/.openclaw/workspace", size-mib = 10240 }

[network]
egress = ["*"]

[secrets]
OPENROUTER_API_KEY = { ref = "reef://clawbits-openclaw/openrouter", host = "openrouter.ai" }
