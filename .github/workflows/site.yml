name: site

on:
  push:
    branches: [main]
    paths: &paths [site/**, install.sh, gitops/**, blog/**, README.md, ARCHITECTURE.md, docs/**, roles/README.md, roles/*.toml, fleet/*.toml, skills/**, Cargo.toml, crates/reef/Cargo.toml, .github/workflows/site.yml]
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - if: github.event_name == 'push'
        run: bun run wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
