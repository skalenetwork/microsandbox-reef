name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev
      - run: cargo build --release --locked
      - run: tar czf reef-${{ matrix.target }}.tar.gz -C target/release reef
      - uses: actions/upload-artifact@v7
        with:
          name: reef-${{ matrix.target }}
          path: reef-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes reef-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
